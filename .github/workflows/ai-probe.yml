# One-off diagnostic: prints the raw streamed output of each Glidepath AI model (no secrets printed).
name: Probe AI model streams
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Stream a short answer from each model
        run: |
          for M in @cf/google/gemma-4-26b-a4b-it @cf/qwen/qwen3-30b-a3b-fp8 @cf/meta/llama-3.2-3b-instruct; do
            echo "===== $M"
            curl -sN -m 60 -o /tmp/s.txt -w "HTTP %{http_code}, first byte %{time_starttransfer}s, total %{time_total}s\n" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/run/$M" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              -d '{"messages":[{"role":"system","content":"Be brief."},{"role":"user","content":"Say hello in five words."}],"stream":true,"max_tokens":120}'
            head -c 1500 /tmp/s.txt; echo; echo "..."; tail -c 400 /tmp/s.txt; echo
          done
