# Checks what the live website and app are serving right now (run by hand after publishing).
name: Check the live website
on:
  workflow_dispatch:
    inputs:
      expect:
        description: "Text the home page should contain"
        required: false
        default: "A first officer that helps you fly"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages and look for what was published
        env:
          EXPECT: ${{ inputs.expect }}
        run: |
          S=https://glidepath-ad9.pages.dev
          H=$(curl -fsS "$S/?nocache=$RANDOM" -D /tmp/h.txt); echo "$H" > /tmp/home.html
          grep -i -E "^(HTTP|cache-control|age|cf-cache-status)" /tmp/h.txt || true
          grep -q "$EXPECT" /tmp/home.html && echo "Home page: has \"$EXPECT\"." || { echo "::error::Home page doesn't have \"$EXPECT\"."; FAIL=1; }
          echo "Hero badge: $(grep -o 'class="lh-badge"[^>]*><span>[^<]*' /tmp/home.html | sed 's/.*<span>//')"
          curl -fsSL "$S/features.html" | grep -q "Every feature, in detail" && echo "Features page: live." || { echo "::error::Features page missing."; FAIL=1; }
          grep -q 'id="lh-map"' /tmp/home.html && grep -q 'src="home.js"' /tmp/home.html && echo "Hero: the demo flight map is there." || { echo "::error::Hero flight map missing."; FAIL=1; }
          curl -fsS -o /dev/null "$S/home.js" && echo "home.js: served." || { echo "::error::home.js missing."; FAIL=1; }
          curl -fsSL "$S/privacy.html" | grep -q "Workers AI" && echo "Privacy: mentions Glidepath AI." || { echo "::error::Privacy page is old."; FAIL=1; }
          curl -fsS -o /dev/null -w "Video: HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" "$S/assets/video/glidepath-flight.mp4"
          curl -fsS -o /dev/null -w "404 page: HTTP %{http_code}\n" "$S/this-page-does-not-exist" || true
          curl -fsS "$S/app/version.json" && echo
          curl -fsS "$S/app/sw.js" | grep -o "glidepath-v[0-9]*" | head -1
          curl -fsS -o /dev/null -w "Accounts via site: HTTP %{http_code}\n" "$S/acct/health"
          echo "bridge.json: $(curl -fsS "$S/bridge.json?n=$RANDOM")"
          echo "config.js: $(curl -fsS "$S/config.js?n=$RANDOM" | grep -E 'version|sha256' | tr -d ' ')"
          curl -fsS https://local-ip.sh/server.pem -o /tmp/c.pem && openssl x509 -in /tmp/c.pem -noout -subject -enddate || echo "::warning::local-ip.sh certificate download failed"
          curl -fsS -o /dev/null -w "ntfy: HTTP %{http_code}\n" "https://ntfy.sh/glidepath-test/json?poll=1" || echo "::warning::ntfy unreachable"
          getent hosts 192-168-1-20.local-ip.sh || echo "::warning::local-ip.sh DNS failed"
          echo "simbrief: $(curl -sS -m 20 'https://glidepath-accounts.webeyepagesdev.workers.dev/simbrief?user=glidepath_nobody_xyz' | head -c 200)"
          echo "pcfind: $(curl -sS -m 20 'https://glidepath-accounts.webeyepagesdev.workers.dev/pc/find?code=000000' | head -c 160)"
          [ -z "$FAIL" ]
