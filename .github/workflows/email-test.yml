# Sends one test email (Gmail, then Mailjet) to the sender address and prints
# Mailjet's answer (never the keys), so email problems can be diagnosed.
name: Test email
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/email-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test email with Gmail
        env:
          U: ${{ secrets.GMAIL_USER }}
          P: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$U" ] || [ -z "$P" ]; then echo "No Gmail secrets yet."; exit 0; fi
          PW=$(printf '%s' "$P" | tr -d ' ')
          printf 'From: Glidepath <%s>\r\nTo: <%s>\r\nSubject: Glidepath test email\r\n\r\nIf you can read this, Glidepath email works.\r\n' "$U" "$U" > mail.txt
          curl -sS --ssl-reqd --url smtps://smtp.gmail.com:465 --user "$U:$PW" --mail-from "$U" --mail-rcpt "$U" --upload-file mail.txt 2>&1 | sed "s/$U/[you]/g" && echo "Gmail accepted the test email." || echo "Gmail refused it (see above)."

      - name: Send a test email with Mailjet
        continue-on-error: true
        env:
          K: ${{ secrets.MAILJET_API_KEY }}
          S: ${{ secrets.MAILJET_SECRET_KEY }}
          FROM: ${{ secrets.MAILJET_SENDER_EMAIL }}
        run: |
          echo "Key set: $([ -n "$K" ] && echo yes || echo NO) · Secret set: $([ -n "$S" ] && echo yes || echo NO) · Sender set: $([ -n "$FROM" ] && echo yes || echo NO)"
          echo "Key length: ${#K} · Secret length: ${#S}"
          echo "--- Mailjet answer ---"
          curl -s -u "$K:$S" https://api.mailjet.com/v3.1/send -H "Content-Type: application/json" \
            -d "{\"Messages\":[{\"From\":{\"Email\":\"$FROM\",\"Name\":\"Glidepath\"},\"To\":[{\"Email\":\"$FROM\"}],\"Subject\":\"Glidepath test email\",\"TextPart\":\"If you can read this, Glidepath email works.\"}]}" \
            | sed "s/$FROM/[sender]/g"
          echo; echo "--- Sender status ---"
          curl -s -u "$K:$S" "https://api.mailjet.com/v3/REST/sender?Limit=10" | python3 -c "import sys,json; d=json.load(sys.stdin); [print(x.get('Status'), '(valid)' if x.get('Status')=='Active' else '') for x in d.get('Data',[])] if 'Data' in d else print(d)"
