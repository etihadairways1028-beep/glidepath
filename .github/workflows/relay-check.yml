# Live check: pairing by code through the Glidepath relay (stand-in PC and iPad).
name: Check pairing by code
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save ws@8
      - run: node .github/scripts/relay-check.mjs
