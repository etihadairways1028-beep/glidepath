<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Glidepath</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0f15">
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .lost .lost-k { display: block; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #64B5FF; margin: 0 0 14px; }
    .lost h1 { font-size: clamp(38px, 6vw, 60px); line-height: 1.05; letter-spacing: -.035em; color: #fff; margin: 0 0 14px; }
    .lost p { color: rgba(225,232,248,.7); font-size: 18px; line-height: 1.55; max-width: 44ch; margin: 0 auto 30px; }
    .lost .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/assets/mark.svg" alt="" width="64" height="64" style="margin-bottom:22px">
      <p class="lost-k">404 · Off the chart</p>
      <h1>This page isn't on the map.</h1>
      <p>The link may be old, or the page has moved. Head back to the start, or open the app.</p>
      <div class="row"><a class="btn primary" href="/">Back to Glidepath</a><a class="btn glass" href="/app/">Open the app</a></div>
    </div>
  </main>
</body>
</html>
